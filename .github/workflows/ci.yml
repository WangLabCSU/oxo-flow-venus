name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate oxo-flow workflow TOML syntax
        run: |
          status=0
          for f in venus.oxoflow rules/*.oxoflow; do
            echo "Validating $f"
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" || status=1
          done
          exit $status

      - name: Syntax-check helper scripts
        run: |
          status=0
          for f in scripts/*.py; do
            echo "Checking $f"
            python3 -m py_compile "$f" || status=1
          done
          exit $status

      - name: Check config tables parse
        run: |
          python3 - <<'EOF'
          import csv
          for path, required in [("config/pairs.tsv", {"experiment", "control"}), ("config/groups.tsv", {"name", "samples"})]:
              with open(path) as fh:
                  rows = list(csv.DictReader(fh, delimiter="\t"))
              assert rows, f"{path} is empty"
              assert required <= set(rows[0]), f"{path}: missing columns {required - set(rows[0])}"
              print(f"{path}: {len(rows)} rows OK")
          EOF

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # ─── Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Test (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt -- --check

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  # ─── Build release binaries ────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: venus-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: venus-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: venus-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.artifact }}.tar.gz venus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}.tar.gz

  # ─── Publish to crates.io ─────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        shell: bash
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='oxo-flow-venus'))")
          echo "Tag: $TAG, Crate: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Version mismatch: tag=$TAG crate=$VER"
            exit 1
          fi

      - name: Check if already published
        id: check
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -sf "https://crates.io/api/v1/crates/oxo-flow-venus/${VERSION}" \
            -H "User-Agent: oxo-flow-venus-ci/1.0 (github.com/Traitome/oxo-flow)" \
            -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "oxo-flow-venus ${VERSION} already on crates.io, skipping"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.already_published != 'true'
        run: cargo publish

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            venus-linux-x86_64/venus-linux-x86_64.tar.gz
            venus-macos-x86_64/venus-macos-x86_64.tar.gz
            venus-macos-arm64/venus-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

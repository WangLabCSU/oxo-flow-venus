[workspace]
name = "vep_perl"
description = "Standard offline VEP (Perl) + plugins for pVACseq input re-annotation (venus#31)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
ensembl-vep = "113"
htslib = ">=1.15"
# VEP's perl deps the bioconda package doesn't fully pull (smoke-tested):
perl-list-moreutils = "*"
perl-try-tiny = "*"
perl-dbi = "*"
perl-json = "*"
perl-bio-db-hts = "*"

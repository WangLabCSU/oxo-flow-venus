[workspace]
name = "hla"
description = "HLA typing for venus neoantigen module (SpecHLA, venus#31)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
spechla = "1.0.12"
# Pin to the smoke-proven set (2026-11-04): freebayes 1.0.2 writes VCFs
# without AD in FORMAT and SpecHLA's phase_variants.py crashes on them;
# 1.3.10 (bundled with the smoke env) works.
freebayes = "1.3.10"
samtools = "1.24"
bcftools = "1.25"

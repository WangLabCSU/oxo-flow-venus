# Venus QC environment — reads trimming, per-sample QC reports, cohort aggregation.
# Referenced by rules/qc.oxoflow via `environment = { pixi = "envs/qc/pixi.toml" }`.
[workspace]
name = "venus-qc"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
fastp = ">=0.24"
fastqc = ">=0.12.1"
multiqc = ">=1.25"

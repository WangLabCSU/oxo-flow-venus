# Venus clinical interpretation environment — CIViC/ClinVar annotation,
# AMP tiering and therapy matching (bcftools joins + pandas/pysam parsing).
[workspace]
name = "venus-clinical"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
pandas = ">=2"
pysam = ">=0.22"
bcftools = ">=1.21"
htslib = ">=1.21"
# requests removed (issue #33 N6): clinical_oncokb.py calls the OncoKB API
# with urllib.request (stdlib), no requests import anywhere.

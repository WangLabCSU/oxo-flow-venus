# Venus single-cell environment — dnbc4tools counting + h5ad corroboration.
# Slimmed (issue #33 N6): the venus scrna scripts are deliberately
# dependency-light (scrna_integrate.py / scrna_qc_cluster.py pure-python,
# scrna_corroboration.py h5py-only — no scanpy/anndata import), so scanpy,
# scrublet, leidenalg, igraph and STAR are removed. dnbc4tools itself is
# provisioned outside pixi via config.scrna_bin; fastqc comes from envs/qc.
[workspace]
name = "venus-scrna"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
h5py = "*"
numpy = "*"

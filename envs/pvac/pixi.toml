[workspace]
name = "pvac"
description = "Neoantigen prediction for venus (pVACtools + MHCflurry, venus#31)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11"
# pvactools pins its own mhcflurry version (7.1.5 -> mhcflurry==2.0.6);
# do NOT add a separate mhcflurry pin here or the solve fails.
pvactools = "7.1.5"

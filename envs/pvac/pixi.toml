[workspace]
name = "pvac"
description = "Neoantigen prediction for venus (pVACtools + MHCflurry, venus#31)"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pysam = ">=0.22"

[pypi-dependencies]
# pVACtools pins mhcflurry==2.0.6 for this line; pip resolves it directly.
# (The conda pvactools package's solver pin deadlocked pixi for >50 min.)
# Keep the whole version-bound set consistent: mhcflurry 2.0.6 needs
# Keras 2 (TF<2.16) and numpy<2 (pyarrow pinned accordingly), and
# setuptools<81 (81+ dropped pkg_resources).
pvactools = "==7.1.5"
mhcflurry = "==2.0.6"
tensorflow = "==2.15.1"
setuptools = "==75.6.0"
pyarrow = "==14.0.2"
